version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: secretary_postgres
    restart: always
    environment:
      POSTGRES_USER: secretary_user
      POSTGRES_PASSWORD: secretary_password
      POSTGRES_DB: secretary_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: secretary_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
